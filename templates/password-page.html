<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protected Project — {{PROJECT_TITLE}}</title>
    <link rel="icon" type="image/png" href="/static/picture/brand/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="/static/css/password-page.css" rel="stylesheet">
    <script>
      // Local design preview only. The real website uses the /static URL above.
      if (window.location.protocol === "file:") {
        const localStyles = document.createElement("link");
        localStyles.rel = "stylesheet";
        localStyles.href = "../source-assets/css/password-page.css";
        document.head.appendChild(localStyles);
      }
    </script>
  </head>
  <body>
    <main class="gate">
      <a class="brand" href="/" aria-label="Back to home"></a>
      <h1>Protected Project</h1>
      <p>This case study is password protected. Enter the password to continue.</p>
      <form method="post" autocomplete="off">
        <label for="password">Password</label>
        <input class="field" id="password" name="password" type="password" placeholder="Enter password" required autofocus aria-describedby="password-error" {{INCORRECT_ATTRIBUTES}}>
        <p class="error" id="password-error" role="alert"><!--ERROR_MESSAGE--></p>
        <button class="submit" type="submit">View Project</button>
      </form>
    </main>
  </body>
</html>
